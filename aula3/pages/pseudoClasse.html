<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classe</title>

    <style>
        /*Link não visitado*/
        .meu-link{
            color: green;
        }

        /*Link visitado */
        .meu-link:visited{
            color: red;
        }

        .meu-link:hover{
            color: blue;
        }

    </style>

</head>
<body>
    <h3>Link não foi visitado</h3>
     <a href="https://www.google.com" class="meu-link" >Google</a>

     <h3>Link visitado</h3>
     <a href="https://www.globo.com" class="meu-link" >G1</a>
</body>
</html>
